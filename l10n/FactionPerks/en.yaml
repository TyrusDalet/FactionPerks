name: "Faction Perks"
settings: "Settings"
perkVisibilityModeName: "Perk Visibility"
perkVisibilityModeDescription: "Controls when perks are hidden in the menu.\n1) Never hide perks\n2) Hide perks unless you are a member of the faction\n3) Default - Also hide perks unless you are high enough rank\n4) Also hide perks unless you meet the level requirement\n5) Hide perks unless you meet every requirement"
perkCostModeName: "Perk Costs"
perkCostModeDescription: "Controls how many perk points each faction perk costs.\n1) Default - perks cost points equal to their tier\n2) Cheap - every perk costs 1 point\n3) Free - all faction perks cost 0\nChanging this setting requires a perk respec, as it can't remove perks you no longer have points for."
perkRequirementModeName: "Perk Requirements"
perkRequirementModeDescription: "Controls which requirement types are enforced for faction perks.\n1) Default - rank, level, stat, and prior perk requirements\n2) Fast - rank, stat, and prior perk requirements only\n3) Cheap - rank and prior perk requirements only\n4) Debug - faction membership and prior perk requirements only"
leaderTrainingEnabledName: "Leader Training"
leaderTrainingEnabledDescription: "When enabled, tier 4 faction perks are hidden from the normal perk menu until a senior member of that faction teaches you about leadership. The player must still be rank 10 in the faction."
debugVerbosityName: "Debug Verbosity"
debugVerbosityDescription: "Controls FactionPerks debug logging.\n0) Off\n1) Important state changes only\n2) Detailed perk effect logs\n3) Trace-level calculation and polling logs"
